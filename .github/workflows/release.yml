# Release builds. Pushing a tag `vX.Y.Z` (matching Cargo.toml's version)
# builds, tests and packages both platforms and publishes a GitHub release.
# Run it by hand (workflow_dispatch), or change this file on a claude/**
# branch, for a dry run: the same builds and packages, uploaded as an
# artifact, with no release.
#
# Every file is signed (minisign) and the updater accepts only files signed
# by a key in packaging/release-keys.pub; see DEPLOY.md. Third-party
# actions are pinned to commits.
#
# Linux builds on Rocky Linux 8 so the binary needs only glibc 2.28: it runs
# on Rocky/RHEL 8 and 9, Ubuntu 20.04 and later, Debian 11 and later.
name: release

on:
  push:
    tags: ["v*"]
    # Dry runs when the release, signing or update code changes on a working
    # branch (tag pushes ignore the path filter).
    branches: ["claude/**"]
    paths: [".github/workflows/release.yml", "packaging/sign-release.sh", "packaging/release-keys.pub", "src/update/**", ".gitattributes"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: v
        name: Version from Cargo.toml (must match the tag)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"\r\?$/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
          echo "version $version"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Package
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          New-Item -ItemType Directory dist, stage | Out-Null
          Copy-Item target/release/fex.exe dist/fex-windows-x64.exe
          Copy-Item target/release/fex.exe, WINDOWS.md stage/
          Compress-Archive -Path stage/* -DestinationPath "dist/fex-$v-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-windows
          path: dist/
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-latest
    container: rockylinux:8
    steps:
      - name: Build tools
        run: dnf install -y --setopt=install_weak_deps=False gcc git tar gzip binutils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --release --locked
      - name: glibc floor is 2.28
        run: |
          newest=$(objdump -T target/release/fex | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1)
          echo "newest glibc symbol: $newest"
          [ "$(printf '%s\n2.28\n' "$newest" | sort -V | tail -1)" = 2.28 ] || { echo "::error::needs glibc $newest"; exit 1; }
      - name: Test
        run: cargo test --locked
      - name: Package
        run: |
          v="${{ needs.version.outputs.version }}"
          mkdir -p dist "stage/fex-$v"
          cp target/release/fex dist/fex-linux-x64
          cp target/release/fex LINUX.md packaging/linux/fex-indexd.service "stage/fex-$v/"
          tar -C stage -czf "dist/fex-$v-linux-x64.tar.gz" "fex-$v"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-linux
          path: dist/
          if-no-files-found: error

  # Tags only. The signing key is in the protected `release` environment
  # (required reviewer, v* tags only), so nothing else can use it.
  publish:
    needs: [version, windows, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Tools
        run: sudo apt-get install -y --no-install-recommends minisign
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "::error::MINISIGN_SECRET_KEY isn't set in the release environment"; exit 1; }
          key="$RUNNER_TEMP/release.key"
          (umask 077; printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          printf '%s\n' "$MINISIGN_PASSWORD" | sh packaging/sign-release.sh dist "$VERSION" "$key"
          rm -f "$key"
      - name: The shipped updater accepts the signatures (with its built-in keys)
        run: |
          chmod +x dist/fex-linux-x64
          for f in fex-linux-x64 fex-windows-x64.exe; do dist/fex-linux-x64 update verify "dist/$f" "dist/$f.minisig" "$f"; done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "FEx $VERSION" --generate-notes --verify-tag

  # Everything else: the same packaging, signed with a throwaway key, kept
  # as an artifact. No release, no secrets.
  dry-run:
    needs: [version, windows, linux]
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Tools
        run: sudo apt-get install -y --no-install-recommends minisign
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Sign with a throwaway key, and verify with the shipped updater
        run: |
          minisign -G -W -p "$RUNNER_TEMP/t.pub" -s "$RUNNER_TEMP/t.key"
          echo | sh packaging/sign-release.sh dist "$VERSION" "$RUNNER_TEMP/t.key"
          chmod +x dist/fex-linux-x64
          key=$(tail -1 "$RUNNER_TEMP/t.pub")
          for f in fex-linux-x64 fex-windows-x64.exe; do dist/fex-linux-x64 update verify "dist/$f" "dist/$f.minisig" "$f" --key "$key"; done
          # A file signed for another platform must be refused.
          if dist/fex-linux-x64 update verify dist/fex-linux-x64 dist/fex-windows-x64.exe.minisig fex-linux-x64 --key "$key"; then exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dry-run-${{ needs.version.outputs.version }}
          path: dist/
