[package]
name = "fex"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"] }
regex = "1.13.1"
memchr = "2.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
raw-window-handle = "0.6.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Time", "Win32_NetworkManagement_NetManagement", "Win32_System_IO", "Win32_System_Threading", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Registry", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Ioctl", "Win32_UI_Input_KeyboardAndMouse", "Win32_NetworkManagement_WNet", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage", "Win32_System_SystemServices", "Win32_UI_Shell_Common", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel", "Win32_System_Services", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_System_Console"] }

# Linux port prototype (src/linux). Target-specific, so the Windows build's
# dependency graph and eframe features are unchanged.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["x11"] }
# Symbol glyphs for icons (Windows uses Segoe UI Symbol); bundled so they
# render on minimal installs too.
egui = { version = "0.37.0", default-features = false, features = ["monochrome_emoji_fonts"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[build-dependencies]
png = "0.18"
